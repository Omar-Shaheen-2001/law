openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Court Session Management AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: dashboard
    description: Dashboard summary operations
  - name: ai
    description: AI extraction operations
  - name: sessions
    description: Court session (hearing) operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current user
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /ai/analyze:
    post:
      operationId: analyzeMessage
      tags: [ai]
      summary: Analyze a pasted court SMS message with AI and extract structured fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: Extracted session fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionExtraction"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AI extraction failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List all court sessions
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SessionStatus"
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Save a reviewed session to Google Sheets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a single session by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update fields on a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdate"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/report:
    get:
      operationId: getSessionReport
      tags: [sessions]
      summary: Get the report for a court session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session report (or null if none exists)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SessionReport"
                  - type: "null"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: upsertSessionReport
      tags: [sessions]
      summary: Create or update the report for a court session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionReportInput"
      responses:
        "200":
          description: Updated session report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReport"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    AuthUser:
      type: object
      required: [username]
      properties:
        username:
          type: string

    DashboardStats:
      type: object
      required:
        [totalCases, todayHearings, upcomingHearings, finishedHearings, totalPoas]
      properties:
        totalCases:
          type: integer
        todayHearings:
          type: integer
        upcomingHearings:
          type: integer
        finishedHearings:
          type: integer
        totalPoas:
          type: integer

    MessageInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          description: Raw court SMS text pasted by the secretary

    SessionStatus:
      type: string
      enum: [Upcoming, Today, Finished, Cancelled]

    SessionExtraction:
      type: object
      description: Fields extracted by AI from the SMS message. Any missing field is null.
      required:
        [
          case_number,
          plaintiff,
          defendant,
          court,
          court_circuit,
          case_subject,
          session_type,
          session_date_hijri,
          session_time,
          notes,
        ]
      properties:
        case_number:
          type: ["string", "null"]
        plaintiff:
          type: ["string", "null"]
        defendant:
          type: ["string", "null"]
        court:
          type: ["string", "null"]
        court_circuit:
          type: ["string", "null"]
        case_subject:
          type: ["string", "null"]
        session_type:
          type: ["string", "null"]
        session_date_hijri:
          type: ["string", "null"]
        session_time:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    SessionInput:
      type: object
      description: Reviewed/edited fields submitted to create a new session row
      properties:
        caseNumber:
          type: ["string", "null"]
        plaintiff:
          type: ["string", "null"]
        defendant:
          type: ["string", "null"]
        court:
          type: ["string", "null"]
        courtCircuit:
          type: ["string", "null"]
        caseSubject:
          type: ["string", "null"]
        sessionType:
          type: ["string", "null"]
        sessionDateHijri:
          type: ["string", "null"]
        sessionTime:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    SessionUpdate:
      type: object
      description: Partial update to an existing session row
      properties:
        caseNumber:
          type: ["string", "null"]
        plaintiff:
          type: ["string", "null"]
        defendant:
          type: ["string", "null"]
        court:
          type: ["string", "null"]
        courtCircuit:
          type: ["string", "null"]
        caseSubject:
          type: ["string", "null"]
        sessionType:
          type: ["string", "null"]
        sessionDateHijri:
          type: ["string", "null"]
        sessionTime:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/SessionStatus"

    Session:
      type: object
      required:
        [
          id,
          caseNumber,
          plaintiff,
          defendant,
          court,
          courtCircuit,
          caseSubject,
          sessionType,
          sessionDateHijri,
          sessionTime,
          notes,
          status,
          reminder24,
          reminder6,
          createdAt,
          hearingAt,
        ]
      properties:
        id:
          type: integer
          description: 1-based row index within the Google Sheet
        caseNumber:
          type: ["string", "null"]
        plaintiff:
          type: ["string", "null"]
        defendant:
          type: ["string", "null"]
        court:
          type: ["string", "null"]
        courtCircuit:
          type: ["string", "null"]
        caseSubject:
          type: ["string", "null"]
        sessionType:
          type: ["string", "null"]
        sessionDateHijri:
          type: ["string", "null"]
        sessionDay:
          type: ["string", "null"]
          description: Arabic day name (e.g. الخميس, الأحد)
        sessionTime:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/SessionStatus"
        reminder24:
          type: boolean
        reminder6:
          type: boolean
        createdAt:
          type: string
          format: date-time
        hearingAt:
          type: ["string", "null"]
          format: date-time
          description: Computed UTC datetime of the hearing (from sessionDateHijri + sessionTime). Null if either field is missing or unparseable.

    SessionReportInput:
      type: object
      description: Input fields for creating or updating a session report
      properties:
        reportNumber:
          type: string
        lawyerName:
          type: string
        summary:
          type: string
        courtDecision:
          type: string
        nextSessionDate:
          type: string
        nextSessionTime:
          type: string
        ourActionRequired:
          type: string
        clientActionRequired:
          type: string
        reportDate:
          type: string

    SessionReport:
      type: object
      required:
        [
          reportNumber,
          lawyerName,
          summary,
          courtDecision,
          nextSessionDate,
          nextSessionTime,
          ourActionRequired,
          clientActionRequired,
          reportDate,
          createdAt,
          updatedAt,
        ]
      properties:
        reportNumber:
          type: string
        lawyerName:
          type: string
        summary:
          type: string
        courtDecision:
          type: string
        nextSessionDate:
          type: string
        nextSessionTime:
          type: string
        ourActionRequired:
          type: string
        clientActionRequired:
          type: string
        reportDate:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
